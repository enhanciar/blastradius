[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blastradius-cli"
version = "0.1.0"
description = "See what breaks before you change a Python function: callers, transitive dependents and affected tests, locally."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Enhanciar" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["call-graph", "impact-analysis", "blast-radius", "static-analysis", "refactoring"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://enhanciar.in"

[project.scripts]
blastradius = "blastradius.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
